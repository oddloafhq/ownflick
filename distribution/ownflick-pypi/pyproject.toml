[tool.poetry]
name = "ownflick"
version = "0.8.50"
description = "Install OwnFlick, the private media feed formerly called Spooly"
authors = ["Oddloaf <hello@oddloaf.dev>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/oddloafhq/ownflick"
repository = "https://github.com/oddloafhq/ownflick"
packages = [{ include = "ownflick" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
spooly = "==0.8.50"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
